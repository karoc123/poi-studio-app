services:
  poi-studio:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: poi-studio
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=file:/app/data/local.db
      # Optional: set a random secret for session verification if desired
      # - SESSION_SECRET=change-me-in-production
      # Optional: if using Turso cloud instead of local SQLite:
      # - DATABASE_URL=libsql://your-db.turso.io
      # - DATABASE_AUTH_TOKEN=your-turso-token
    volumes:
      # Persistent named volume storing SQLite local.db, WAL, and SHM files
      - poi-studio-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  poi-studio-data:
    name: poi_studio_data
